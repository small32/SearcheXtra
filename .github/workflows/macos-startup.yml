name: macOS startup

on:
  push:
    branches: ['codex/**']
    paths:
      - 'Sources/SearcheXtra/**'
      - 'Tests/SearcheXtraTests/**'
      - 'Tests/ExtensionUserScriptsTests.mjs'
      - 'Tests/ExtensionUserWorldTests.mjs'
      - 'Tests/verify-macos-app-launch.sh'
      - 'Package.swift'
      - 'build.sh'
      - '.github/workflows/macos-startup.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  startup:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      SEARCH_ARCH: arm64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Diagnose installed 2.1.0 before building
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SEARCHEXTRA_LAUNCH_LOG_DIR: build/macos-launch-smoke/baseline
        shell: bash
        run: |
          baseline="$RUNNER_TEMP/searchextra-startup-baseline"
          mkdir -p "$baseline"
          gh release download v2.1.0 --repo "$GITHUB_REPOSITORY" --pattern SearcheXtra-2.1.0-arm64.zip --dir "$baseline"
          ditto -x -k "$baseline/SearcheXtra-2.1.0-arm64.zip" "$baseline"
          bash Tests/verify-macos-app-launch.sh "$baseline/SearcheXtra.app" "$baseline/no-build-resources.bundle"

      - name: Build macOS ARM64
        run: ./build.sh release

      - name: Launch fixed app without build resources
        env:
          SEARCHEXTRA_LAUNCH_LOG_DIR: build/macos-launch-smoke/fixed
        run: bash Tests/verify-macos-app-launch.sh build/SearcheXtra.app "$(swift build -c release --arch arm64 -Xswiftc -Osize --show-bin-path)/SearcheXtra_SearcheXtra.bundle"

      - name: Test user-script permission bridge
        run: |
          node Tests/ExtensionUserScriptsTests.mjs
          node Tests/ExtensionUserWorldTests.mjs

      - name: Test macOS browser regressions
        run: SEARCH_PROBE=interface-tests swift test -c release --arch arm64 -Xswiftc -Osize --filter 'BookmarkBarTests|BookmarkIconTests|BookmarkManagerTests|MiddleClickTests|ExtensionVersionTests|ExtensionNativeTests|ExtensionLifecycleTests|ExtensionScriptingTests|FlowDragTests|FlowDragAuxiliaryTests|PrivacyAndWindowTests|VaultAndUpdaterTests'

      - name: Verify original ScriptCat MV3 package
        shell: bash
        run: |
          package="$RUNNER_TEMP/scriptcat-v1.4.0-chrome.zip"
          curl --fail --location --retry 3 'https://github.com/scriptscat/scriptcat/releases/download/v1.4.0/scriptcat-v1.4.0-chrome.zip' --output "$package"
          printf '92be0136bef5b18863965f1ec9a5c780549e0269f0c61391689eb51152792e43  %s\n' "$package" | shasum -a 256 --check
          echo "SEARCHEXTRA_TEST_MV3_FOLDER=$package" >> "$GITHUB_ENV"

      - name: Test original ScriptCat with MV2 coexistence
        run: SEARCH_PROBE=interface-tests swift test -c release --arch arm64 -Xswiftc -Osize --filter ExtensionScriptCatTests

      - name: Package verified app
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          codesign --verify --deep --strict build/SearcheXtra.app
          ditto -c -k --keepParent build/SearcheXtra.app "build/SearcheXtra-$version-arm64-startup-fix.zip"

      - name: Collect native test diagnostics
        if: always()
        shell: bash
        run: |
          destination=build/macos-launch-smoke/native-tests
          mkdir -p "$destination"
          for report in "$HOME/Library/Logs/DiagnosticReports/"*SearcheXtra*.ips "$HOME/Library/Logs/DiagnosticReports/"*SearcheXtra*.crash "$HOME/Library/Logs/DiagnosticReports/"*xctest*.ips; do
            if [ -f "$report" ]; then cp "$report" "$destination/"; fi
          done
          log show --last 5m --style compact --predicate 'process CONTAINS "SearcheXtra" OR process CONTAINS "xctest"' > "$destination/system.log" 2>&1 || true

      - uses: actions/upload-artifact@v4
        with:
          name: SearcheXtra-macOS-startup-fix
          path: build/*-arm64-startup-fix.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macOS-startup-diagnostics
          path: build/macos-launch-smoke/
          if-no-files-found: ignore
