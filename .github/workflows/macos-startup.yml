name: macOS startup

on:
  push:
    branches: ['codex/**']
    paths:
      - 'Sources/SearcheXtra/**'
      - 'Tests/verify-macos-app-launch.sh'
      - 'Package.swift'
      - 'build.sh'
      - '.github/workflows/macos-startup.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  startup:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      SEARCH_ARCH: arm64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Diagnose installed 2.1.0 before building
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SEARCHEXTRA_LAUNCH_LOG_DIR: build/macos-launch-smoke/baseline
        shell: bash
        run: |
          baseline="$RUNNER_TEMP/searchextra-startup-baseline"
          mkdir -p "$baseline"
          gh release download v2.1.0 --repo "$GITHUB_REPOSITORY" --pattern SearcheXtra-2.1.0-arm64.zip --dir "$baseline"
          ditto -x -k "$baseline/SearcheXtra-2.1.0-arm64.zip" "$baseline"
          bash Tests/verify-macos-app-launch.sh "$baseline/SearcheXtra.app" "$baseline/no-build-resources.bundle"

      - name: Build macOS ARM64
        run: ./build.sh release

      - name: Launch fixed app without build resources
        env:
          SEARCHEXTRA_LAUNCH_LOG_DIR: build/macos-launch-smoke/fixed
        run: bash Tests/verify-macos-app-launch.sh build/SearcheXtra.app "$(swift build -c release --arch arm64 -Xswiftc -Osize --show-bin-path)/SearcheXtra_SearcheXtra.bundle"

      - name: Package verified app
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          codesign --verify --deep --strict build/SearcheXtra.app
          ditto -c -k --keepParent build/SearcheXtra.app "build/SearcheXtra-$version-arm64-startup-fix.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: SearcheXtra-macOS-startup-fix
          path: build/*-arm64-startup-fix.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macOS-startup-diagnostics
          path: build/macos-launch-smoke/
          if-no-files-found: ignore
