name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build
        required: true
        default: v2.2.3
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    name: Build macOS ${{ matrix.arch }}
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            output: build
          - arch: x86_64
            runner: macos-15-intel
            output: build/intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      SEARCH_ARCH: ${{ matrix.arch }}
      OUTPUT_DIR: ${{ matrix.output }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}

      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          test "$RELEASE_TAG" = "v$version"
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE_ARCHIVE=SearcheXtra-$version-$SEARCH_ARCH.zip" >> "$GITHUB_ENV"
          test "$(uname -m)" = "$SEARCH_ARCH"
          xcodebuild -version
          swift --version

      - name: Build architecture-specific Release
        run: ./build.sh release

      - name: Launch packaged app without build resources
        run: bash Tests/verify-macos-app-launch.sh "$OUTPUT_DIR/SearcheXtra.app" "$(swift build -c release --arch "$SEARCH_ARCH" -Xswiftc -Osize --show-bin-path)/SearcheXtra_SearcheXtra.bundle"

      - name: Test user-script permission bridge
        run: |
          node Tests/ExtensionUserScriptsTests.mjs
          node Tests/ExtensionUserWorldTests.mjs
          node Tests/ExtensionWorkerRecovery/run.js
          node Tests/FlowDragTests.mjs

      - name: Test macOS browser regressions
        run: bash Tests/run-macos-regressions.sh

      - name: Verify original ScriptCat MV3 package
        shell: bash
        run: |
          package="$RUNNER_TEMP/scriptcat-v1.4.0-chrome.zip"
          curl --fail --location --retry 3 'https://github.com/scriptscat/scriptcat/releases/download/v1.4.0/scriptcat-v1.4.0-chrome.zip' --output "$package"
          printf '92be0136bef5b18863965f1ec9a5c780549e0269f0c61391689eb51152792e43  %s\n' "$package" | shasum -a 256 --check
          echo "SEARCHEXTRA_TEST_MV3_FOLDER=$package" >> "$GITHUB_ENV"

      - name: Test original ScriptCat with MV2 coexistence
        id: scriptcat
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/test-diagnostics"
          SEARCH_PROBE=interface-tests swift test -c release --arch "$SEARCH_ARCH" -Xswiftc -Osize --filter ExtensionScriptCatTests 2>&1 | tee "$RUNNER_TEMP/test-diagnostics/scriptcat.log"

      - name: Capture failed ScriptCat native backtrace
        if: ${{ failure() && steps.scriptcat.outcome == 'failure' }}
        timeout-minutes: 2
        shell: bash
        run: |
          if ! grep -Eiq 'unexpected signal|signal code' "$RUNNER_TEMP/test-diagnostics/scriptcat.log"; then exit 0; fi
          bundle="$(swift build -c release --arch "$SEARCH_ARCH" -Xswiftc -Osize --show-bin-path)/SearcheXtraPackageTests.xctest"
          platform="$(xcrun --sdk macosx --show-sdk-platform-path)"
          # A diagnostic rerun never replaces the failed normal test result.
          # Supply the same XCTest framework paths that SwiftPM injects.
          xcrun lldb --batch --no-lldbinit \
            -o 'settings set target.disable-aslr false' \
            -o "settings set target.env-vars 'SEARCH_PROBE=scriptcat-lldb-$SEARCH_ARCH' 'SWIFT_TESTING_ENABLED=0' 'SEARCHEXTRA_TEST_MV3_FOLDER=$SEARCHEXTRA_TEST_MV3_FOLDER' 'DYLD_FRAMEWORK_PATH=$platform/Developer/Library/Frameworks:$platform/Developer/Library/PrivateFrameworks' 'DYLD_LIBRARY_PATH=$platform/Developer/usr/lib'" \
            -o 'run' -o 'thread backtrace all' -o 'image list -o -f' \
            -k 'thread backtrace all' -k 'image list -o -f' -k 'quit 99' \
            -- "$(xcrun -f xctest)" -XCTest \
            SearcheXtraTests.ExtensionScriptCatTests/testOriginalMV3RunsGMStorageXHRFramesAlongsideMV2 \
            "$bundle" > "$RUNNER_TEMP/test-diagnostics/scriptcat-backtrace.log" 2>&1 || true
          cat "$RUNNER_TEMP/test-diagnostics/scriptcat-backtrace.log"

      - name: Verify and package application
        shell: bash
        run: |
          set -euo pipefail
          app="$OUTPUT_DIR/SearcheXtra.app"
          test "$(lipo -archs "$app/Contents/MacOS/SearcheXtra")" = "$SEARCH_ARCH"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$RELEASE_VERSION"
          plutil -lint "$app/Contents/Info.plist"
          codesign --verify --deep --strict "$app"
          ditto -c -k --keepParent "$app" "$OUTPUT_DIR/$RELEASE_ARCHIVE"
          (cd "$OUTPUT_DIR" && shasum -a 256 "$RELEASE_ARCHIVE" > SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: SearcheXtra-macos-${{ matrix.arch }}
          path: |
            ${{ matrix.output }}/SearcheXtra-*-${{ matrix.arch }}.zip
            ${{ matrix.output }}/SHA256SUMS.txt
          if-no-files-found: error

      - name: Collect native test crash reports
        if: failure()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/test-diagnostics"
          # CrashReporter writes asynchronously after xctest has exited.
          for report_attempt in {1..15}; do
            for reports in "$HOME/Library/Logs/DiagnosticReports" /Library/Logs/DiagnosticReports; do
              if [ -d "$reports" ]; then
                find "$reports" -maxdepth 2 -type f \( -name '*SearcheXtra*' -o -name '*xctest*' -o -name '*XCTest*' \) \
                  -exec cp {} "$RUNNER_TEMP/test-diagnostics/" \;
              fi
            done
            if compgen -G "$RUNNER_TEMP/test-diagnostics/*.ips" > /dev/null \
              || compgen -G "$RUNNER_TEMP/test-diagnostics/*.crash" > /dev/null; then
              break
            fi
            sleep 2
          done

      - name: Upload native test crash reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: SearcheXtra-diagnostics-${{ matrix.arch }}
          path: ${{ runner.temp }}/test-diagnostics
          if-no-files-found: ignore

  publish:
    name: Publish release assets
    needs: macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: SearcheXtra-macos-*
          path: release
      - name: Publish GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          test "$RELEASE_TAG" = "v$version"
          cat release/SearcheXtra-macos-arm64/SHA256SUMS.txt release/SearcheXtra-macos-x86_64/SHA256SUMS.txt > release/SHA256SUMS.txt
          cp release/SearcheXtra-macos-arm64/*.zip release/SearcheXtra-macos-x86_64/*.zip release/
          (cd release && shasum -a 256 --check SHA256SUMS.txt)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/*.zip release/SHA256SUMS.txt --clobber
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "SearcheXtra $version" --notes-file docs/RELEASE_NOTES.md \
              release/*.zip release/SHA256SUMS.txt
          fi
          gh release edit "$RELEASE_TAG" --draft=false --latest \
            --title "SearcheXtra $version" --notes-file docs/RELEASE_NOTES.md
