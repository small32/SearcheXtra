name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build
        required: true
        default: v2.2.2
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    name: Build macOS ${{ matrix.arch }}
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            output: build
          - arch: x86_64
            runner: macos-15-intel
            output: build/intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      SEARCH_ARCH: ${{ matrix.arch }}
      OUTPUT_DIR: ${{ matrix.output }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}

      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          test "$RELEASE_TAG" = "v$version"
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE_ARCHIVE=SearcheXtra-$version-$SEARCH_ARCH.zip" >> "$GITHUB_ENV"
          test "$(uname -m)" = "$SEARCH_ARCH"
          xcodebuild -version
          swift --version

      - name: Build architecture-specific Release
        run: ./build.sh release

      - name: Launch packaged app without build resources
        run: bash Tests/verify-macos-app-launch.sh "$OUTPUT_DIR/SearcheXtra.app" "$(swift build -c release --arch "$SEARCH_ARCH" -Xswiftc -Osize --show-bin-path)/SearcheXtra_SearcheXtra.bundle"

      - name: Test user-script permission bridge
        run: |
          node Tests/ExtensionUserScriptsTests.mjs
          node Tests/ExtensionUserWorldTests.mjs
          node Tests/ExtensionWorkerRecovery/run.js
          node Tests/FlowDragTests.mjs

      - name: Test macOS browser regressions
        run: bash Tests/run-macos-regressions.sh

      - name: Verify original ScriptCat MV3 package
        shell: bash
        run: |
          package="$RUNNER_TEMP/scriptcat-v1.4.0-chrome.zip"
          curl --fail --location --retry 3 'https://github.com/scriptscat/scriptcat/releases/download/v1.4.0/scriptcat-v1.4.0-chrome.zip' --output "$package"
          printf '92be0136bef5b18863965f1ec9a5c780549e0269f0c61391689eb51152792e43  %s\n' "$package" | shasum -a 256 --check
          echo "SEARCHEXTRA_TEST_MV3_FOLDER=$package" >> "$GITHUB_ENV"

      - name: Test original ScriptCat with MV2 coexistence
        run: SEARCH_PROBE=interface-tests swift test -c release --arch "$SEARCH_ARCH" -Xswiftc -Osize --filter ExtensionScriptCatTests

      - name: Verify and package application
        shell: bash
        run: |
          set -euo pipefail
          app="$OUTPUT_DIR/SearcheXtra.app"
          test "$(lipo -archs "$app/Contents/MacOS/SearcheXtra")" = "$SEARCH_ARCH"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$RELEASE_VERSION"
          plutil -lint "$app/Contents/Info.plist"
          codesign --verify --deep --strict "$app"
          ditto -c -k --keepParent "$app" "$OUTPUT_DIR/$RELEASE_ARCHIVE"
          (cd "$OUTPUT_DIR" && shasum -a 256 "$RELEASE_ARCHIVE" > SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: SearcheXtra-macos-${{ matrix.arch }}
          path: |
            ${{ matrix.output }}/SearcheXtra-*-${{ matrix.arch }}.zip
            ${{ matrix.output }}/SHA256SUMS.txt
          if-no-files-found: error

  publish:
    name: Publish release assets
    needs: macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: SearcheXtra-macos-*
          path: release
      - name: Publish GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          test "$RELEASE_TAG" = "v$version"
          cat release/SearcheXtra-macos-arm64/SHA256SUMS.txt release/SearcheXtra-macos-x86_64/SHA256SUMS.txt > release/SHA256SUMS.txt
          cp release/SearcheXtra-macos-arm64/*.zip release/SearcheXtra-macos-x86_64/*.zip release/
          (cd release && shasum -a 256 --check SHA256SUMS.txt)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/*.zip release/SHA256SUMS.txt --clobber
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "SearcheXtra $version" --notes-file docs/RELEASE_NOTES.md \
              release/*.zip release/SHA256SUMS.txt
          fi
          gh release edit "$RELEASE_TAG" --draft=false --latest \
            --title "SearcheXtra $version" --notes-file docs/RELEASE_NOTES.md
