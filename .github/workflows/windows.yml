name: Windows x64
on:
  push:
    branches: ['**']
    paths: ['Windows/**', 'Tests/ExtensionUserScriptsWindowsTests.mjs', 'Tests/FlowDragTests.mjs', 'Tests/AutoScrollWindowsTests.mjs', '.github/workflows/windows.yml', 'VERSION', 'Sources/SearcheXtra/Resources/**']
  pull_request:
    paths: ['Windows/**', 'Tests/ExtensionUserScriptsWindowsTests.mjs', 'Tests/FlowDragTests.mjs', 'Tests/AutoScrollWindowsTests.mjs', '.github/workflows/windows.yml', 'VERSION', 'Sources/SearcheXtra/Resources/**']
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test MV3 user-script bootstrap
        run: node Tests/ExtensionUserScriptsWindowsTests.mjs
      - name: Test shared drag gestures
        run: |
          node Tests/FlowDragTests.mjs
          node Tests/AutoScrollWindowsTests.mjs
      - name: Prepare installer compiler
        shell: pwsh
        run: |
          $package = Join-Path $env:RUNNER_TEMP 'innosetup.zip'
          Invoke-WebRequest 'https://api.nuget.org/v3-flatcontainer/tools.innosetup/6.7.3/tools.innosetup.6.7.3.nupkg' -OutFile $package
          if ((Get-FileHash $package -Algorithm SHA256).Hash -ne 'F780898E402FF80612CC8D9FCB8C6E02932BD1CB4C900FFDAA31F9341CFB49F4') { throw 'Installer compiler package checksum mismatch' }
          $compiler = Join-Path $env:RUNNER_TEMP 'innosetup'
          Expand-Archive $package -DestinationPath $compiler
          Add-Content $env:GITHUB_PATH (Join-Path $compiler 'tools')
      - name: Test and publish Windows x64
        shell: pwsh
        run: ./Windows/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: SearcheXtra-win-x64
          path: |
            Windows/artifacts/*.zip
            Windows/artifacts/*-setup.exe
            Windows/artifacts/SHA256SUMS.txt
